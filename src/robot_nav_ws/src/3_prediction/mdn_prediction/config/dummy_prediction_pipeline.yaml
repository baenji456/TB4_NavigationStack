dummy_tracker_node:
  ros__parameters:
    mode: oscillate
    start_x: -3.0
    start_y: 2.0
    end_x: 3.0
    end_y: 2.0
    speed: 0.25
    publish_rate_hz: 10.0
    window_size: 20
    publish_topic: /tracked_object/poses
    frame_id: map

dummy_mdn_pred_node:
  ros__parameters:
    dt: 0.1
    H: 3
    forward_speed: 1.0
    topic_in:  /tracked_object/poses
    topic_out: /predictions/mixtures
    drift_base: 0.05
    drift_side: 0.40
    sigx0: 0.20
    sigy0: 0.05
    dsigx: 0.05
    dsigy: 0.06
    rho0:  0.2
    rho1: -0.3
    rho2:  0.1
    w0_base: 0.45
    w1_base: 0.30
    dw0: -0.01
    dw1:  0.005

mdn_sampler_single:
  ros__parameters:
    topic_in: /predictions/mixtures
    topic_out_single: /predictions/costmap_t05s
    output_mode: single
    output_h: -1
    output_t: 0.5
    x_min: -10.0
    x_max:  10.0
    y_min: -10.0
    y_max:  10.0
    resolution: 0.06
    samples_per_step: 10000
    seed: 0
    backend: numpy

mdn_sampler_array:
  ros__parameters:
    topic_in: /predictions/mixtures
    topic_out: /predictions/costmaps
    output_mode: array
    x_min: -10.0
    x_max:  10.0
    y_min: -10.0
    y_max:  10.0
    resolution: 0.06
    samples_per_step: 10000
    seed: 0
    backend: numpy